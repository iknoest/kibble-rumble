<style>
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; background: #03030c; font-family: 'Press Start 2P', monospace; }
  .err-box { width: min(92vw, 640px); aspect-ratio: 4/3; background: linear-gradient(180deg, #1530c9, #0a1a8a); border: 8px solid #333; border-radius: 12px; box-shadow: 0 0 40px rgba(21, 48, 201, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 24px; box-sizing: border-box; position: relative; overflow: hidden; }
  .err-box::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px); pointer-events: none; }
  .err-title { font-size: clamp(22px, 5vw, 36px); color: #fff; text-shadow: 3px 3px 0 #000, 0 0 12px #3b82f6; letter-spacing: 2px; }
  .err-sub { font-family: 'VT323', monospace; font-size: clamp(24px, 6vw, 38px); color: #ffd21f; letter-spacing: 3px; }
  .err-msg { font-size: clamp(9px, 2vw, 12px); color: #9fb4ff; line-height: 1.8; max-width: 440px; }
  .err-btn { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: #d8352f; color: #fff; text-decoration: none; font-size: clamp(10px, 2.2vw, 13px); border: 3px solid #fff; border-radius: 4px; box-shadow: 0 4px 0 #000; transition: transform 0.1s, box-shadow 0.1s; z-index: 2; }
  .err-btn:hover { background: #ef4444; transform: translateY(-2px); box-shadow: 0 6px 0 #000; }
  .err-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
</style>
</head>
<body>
<div class="err-box">
  <div class="err-title">NO SIGNAL</div>
  <div class="err-sub">TAPE NOT FOUND · 404</div>
  <div class="err-msg">THE REQUESTED CASSETTE DOES NOT EXIST ON THE NK-500R SHELF.</div>

</div>
