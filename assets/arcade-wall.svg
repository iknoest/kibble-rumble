<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMax slice">
  <!-- Original, deliberately dim row of upright cabinet silhouettes for the back wall. Flat shapes; glow is a blurred emitted light. -->
  <defs>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="22"/></filter>
    <g id="cab">
      <!-- marquee, screen hood, control deck, body -->
      <path d="M0 120 L0 40 L170 40 L170 120 L150 150 L150 270 L184 300 L184 330 L160 340 L160 520 L10 520 L10 340 L-14 330 L-14 300 L20 270 L20 150 Z" fill="#11111d"/>
      <rect x="10" y="50" width="150" height="56" fill="#191a2b"/>
      <rect x="34" y="162" width="102" height="94" fill="#0c1222"/>
      <rect x="0" y="300" width="170" height="10" fill="#161729"/>
    </g>
  </defs>
  <rect width="1600" height="520" fill="#0b0b14"/>
  <!-- marquee glows (emitted light) -->
  <g filter="url(#glow)" opacity=".55">
    <rect x="70" y="40" width="150" height="40" fill="#ff2e9a"/>
    <rect x="330" y="20" width="150" height="40" fill="#19d3e6"/>
    <rect x="1120" y="20" width="150" height="40" fill="#ffd21f"/>
    <rect x="1380" y="40" width="150" height="40" fill="#8a4dff"/>
  </g>
  <use href="#cab" x="60" y="40"/>
  <use href="#cab" x="320" y="20"/>
  <use href="#cab" x="1110" y="20"/>
  <use href="#cab" x="1370" y="40"/>
  <!-- marquee faces: flat, muted colour bands -->
  <g opacity=".55">
    <rect x="70" y="90" width="150" height="56" fill="#3a1236"/><rect x="82" y="110" width="126" height="8" fill="#ff2e9a"/>
    <rect x="330" y="70" width="150" height="56" fill="#0d2f3a"/><rect x="342" y="90" width="126" height="8" fill="#19d3e6"/>
    <rect x="1120" y="70" width="150" height="56" fill="#3a3010"/><rect x="1132" y="90" width="126" height="8" fill="#ffd21f"/>
    <rect x="1380" y="90" width="150" height="56" fill="#22143f"/><rect x="1392" y="110" width="126" height="8" fill="#8a4dff"/>
  </g>
  <!-- faint attract-mode screens -->
  <g opacity=".35">
    <rect x="94" y="222" width="102" height="94" fill="#16304f"/>
    <rect x="354" y="202" width="102" height="94" fill="#1f2a55"/>
    <rect x="1144" y="202" width="102" height="94" fill="#16304f"/>
    <rect x="1404" y="222" width="102" height="94" fill="#2a1f55"/>
  </g>
  <!-- skirting board where the wall meets the carpet -->
  <rect x="0" y="508" width="1600" height="12" fill="#14141f"/>
</svg>
